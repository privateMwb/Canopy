<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Canopy: a self-updating study library. Add a folder, run one script, and it shows up on the page.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1110"/>
      <stop offset="100%" stop-color="#101716"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="78%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#0B1110" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B1110" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#18211F"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glowBg)"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- Eyebrow: live status -->
  <circle cx="86" cy="86" r="4.5" fill="#34D399">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="102" y="90" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="12" letter-spacing="2.5" fill="#6B7C78">JUNIOR  ·  INTERMEDIATE  ·  SENIOR</text>

  <!-- Title -->
  <text x="80" y="170" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="88" font-weight="800" letter-spacing="1" fill="url(#title)" filter="url(#glow)">Canopy</text>
  <rect x="82" y="188" width="400" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- Tagline -->
  <text x="82" y="224" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="19" fill="#9CB0AB">A self-updating study library. Add a folder, run one script.</text>

  <!-- Feature chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600"
     letter-spacing="1" text-anchor="middle" fill="#34D399">
    <rect x="82"  y="244" width="128" height="26" rx="13" fill="#101716" stroke="#1F2D2A"/>
    <text x="146" y="261">ADD A FOLDER</text>
    <rect x="222" y="244" width="140" height="26" rx="13" fill="#101716" stroke="#1F2D2A"/>
    <text x="292" y="261">RUN ONE SCRIPT</text>
    <rect x="374" y="244" width="124" height="26" rx="13" fill="#101716" stroke="#1F2D2A"/>
    <text x="436" y="261">STATIC FILES</text>
    <rect x="510" y="244" width="156" height="26" rx="13" fill="#101716" stroke="#1F2D2A"/>
    <text x="588" y="261">NO RUNTIME DEPS</text>
  </g>

  <!-- The tree: a folder grows into the library. Loops every 7s -->

  <!-- Branches -->
  <path d="M800 140 C 824 140 824 84 848 84" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-dasharray="130" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="130;130;0;0;130" keyTimes="0;0.04;0.14;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
  </path>
  <path d="M800 140 C 824 140 824 196 848 196" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-dasharray="130" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="130;130;0;0;130" keyTimes="0;0.04;0.14;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
  </path>
  <path d="M944 84 C 968 84 968 62 992 62" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-dasharray="130" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="130;130;0;0;130" keyTimes="0;0.18;0.28;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
  </path>
  <path d="M944 84 C 968 84 968 106 992 106" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-dasharray="130" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="130;130;0;0;130" keyTimes="0;0.18;0.28;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
  </path>
  <path d="M944 196 C 968 196 968 174 992 174" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-dasharray="130" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="130;130;0;0;130" keyTimes="0;0.2;0.3;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
  </path>
  <path d="M944 196 C 968 196 968 218 992 218" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-dasharray="130" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="130;130;0;0;130" keyTimes="0;0.2;0.3;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
  </path>
  <path d="M944 196 C 968 196 968 262 992 262" fill="none" stroke="#A3E635" stroke-width="2" stroke-linecap="round" stroke-dasharray="140" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="140;140;0;0;140" keyTimes="0;0.52;0.6;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
  </path>

  <!-- Nodes -->
  <rect x="700" y="124" width="100" height="32" rx="16" fill="#0B1110" stroke="url(#title)" stroke-width="2" filter="url(#glow)"/>
  <text x="750" y="144.5" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="url(#title)">content/</text>
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.18;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <rect x="848" y="70" width="96" height="28" rx="14.0" fill="#101716" stroke="#1F2D2A" stroke-width="1.5"/>
    <text x="896.0" y="88.2" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#34D399">python/</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.18;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <rect x="848" y="182" width="96" height="28" rx="14.0" fill="#101716" stroke="#1F2D2A" stroke-width="1.5"/>
    <text x="896.0" y="200.2" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#34D399">docker/</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.32;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <rect x="992" y="49" width="118" height="26" rx="13.0" fill="#101716" stroke="#1F2D2A" stroke-width="1.5"/>
    <text x="1051.0" y="65.8" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#9CB0AB">01-intro</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.33;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <rect x="992" y="93" width="118" height="26" rx="13.0" fill="#101716" stroke="#1F2D2A" stroke-width="1.5"/>
    <text x="1051.0" y="109.8" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#9CB0AB">02-types</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.34;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <rect x="992" y="161" width="118" height="26" rx="13.0" fill="#101716" stroke="#1F2D2A" stroke-width="1.5"/>
    <text x="1051.0" y="177.8" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#9CB0AB">01-images</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.35;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <rect x="992" y="205" width="118" height="26" rx="13.0" fill="#101716" stroke="#1F2D2A" stroke-width="1.5"/>
    <text x="1051.0" y="221.8" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#9CB0AB">02-build</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.63;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <rect x="992" y="249" width="148" height="26" rx="13" fill="#141C0E" stroke="#A3E635" stroke-width="1.6" filter="url(#glow)"/>
    <text x="1066" y="266.5" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11" font-weight="700" fill="#A3E635">+ 03-new-lesson</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.68;0.9;0.97;1" dur="7.0s" repeatCount="indefinite"/>
    <text x="700" y="266" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="12" letter-spacing="1" fill="#6B7C78">$ npm run build</text>
    <text x="700" y="284" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="11" letter-spacing="1" fill="#A3E635">→ it shows up on the page</text>
  </g>
</svg>

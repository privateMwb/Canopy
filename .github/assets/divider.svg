<svg width="1200" height="56" viewBox="0 0 1200 56" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="inRail" x1="40" y1="0" x2="496" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0"/>
      <stop offset="55%" stop-color="#4ADE80" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="outRail" x1="704" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="1"/>
      <stop offset="45%" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Soft halo behind the sprout -->
  <ellipse cx="600" cy="28" rx="120" ry="26" fill="url(#halo)"/>

  <!-- Dotted rails: a lesson folder comes in on the left, a page leaves on the right -->
  <line x1="40" y1="28" x2="496" y2="28" stroke="url(#inRail)" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 13"/>
  <line x1="704" y1="28" x2="1160" y2="28" stroke="url(#outRail)" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 13"/>

  <!-- Faint tick marks above and below the rails -->
  <g stroke="#1F2D2A" stroke-width="1">
    <line x1="100" y1="20" x2="100" y2="23"/><line x1="200" y1="20" x2="200" y2="23"/><line x1="300" y1="20" x2="300" y2="23"/><line x1="400" y1="20" x2="400" y2="23"/>
    <line x1="100" y1="33" x2="100" y2="36"/><line x1="200" y1="33" x2="200" y2="36"/><line x1="300" y1="33" x2="300" y2="36"/><line x1="400" y1="33" x2="400" y2="36"/>
    <line x1="800" y1="20" x2="800" y2="23"/><line x1="900" y1="20" x2="900" y2="23"/><line x1="1000" y1="20" x2="1000" y2="23"/><line x1="1100" y1="20" x2="1100" y2="23"/>
    <line x1="800" y1="33" x2="800" y2="36"/><line x1="900" y1="33" x2="900" y2="36"/><line x1="1000" y1="33" x2="1000" y2="36"/><line x1="1100" y1="33" x2="1100" y2="36"/>
  </g>

  <!-- Chevrons pointing into and out of the sprout -->
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M506 21 L513 28 L506 35" stroke="#4ADE80">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M517 21 L524 28 L517 35" stroke="#34D399">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M676 21 L683 28 L676 35" stroke="#34D399">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M687 21 L694 28 L687 35" stroke="#2DD4BF">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- The sprout pill -->
  <rect x="540" y="12" width="120" height="32" rx="16" fill="#0B1110" stroke="url(#leaf)" stroke-width="1.8" filter="url(#glow)"/>
  <g fill="none" stroke="url(#leaf)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M566 37 L566 27"/>
    <path d="M566 29 C 566 24 562 21 557 21 C 557 26 560 29 566 29 Z"/>
    <path d="M566 27 C 566 22 570 19 575 19 C 575 24 572 27 566 27 Z"/>
  </g>
  <text x="617" y="33" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="14" font-weight="700" fill="url(#leaf)">canopy</text>

  <!-- Packets: a lesson travels in along the left rail, then a page leaves along the right -->
  <circle r="3.6" cy="0" cx="0" fill="#4ADE80" filter="url(#glow)" opacity="0">
    <animateMotion path="M40 28 L496 28" dur="3.2s" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.44;0.5;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.6" cy="0" cx="0" fill="#2DD4BF" filter="url(#glow)" opacity="0">
    <animateMotion path="M704 28 L1160 28" dur="3.2s" keyPoints="0;0;1" keyTimes="0;0.5;1" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.56;0.94;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
